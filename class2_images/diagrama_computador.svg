<svg viewBox="0 0 780 580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">

  <rect width="780" height="580" fill="#f8f8fb" rx="12"/>
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">¿Qué hace un computador?</text>

  <!-- ── ENTRADA ── -->
  <rect x="30" y="58" width="140" height="260" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/>
  <text x="100" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#3949ab">ENTRADA</text>
  <text x="100" y="95" text-anchor="middle" font-size="10" fill="#5c6bc0">Input</text>

  <rect x="48" y="108" width="104" height="36" rx="6" fill="#fff" stroke="#9fa8da" stroke-width="1"/>
  <text x="100" y="124" text-anchor="middle" font-size="11" fill="#333">Teclado</text>
  <text x="100" y="138" text-anchor="middle" font-size="9" fill="#777">texto, números</text>

  <rect x="48" y="154" width="104" height="36" rx="6" fill="#fff" stroke="#9fa8da" stroke-width="1"/>
  <text x="100" y="170" text-anchor="middle" font-size="11" fill="#333">Ratón</text>
  <text x="100" y="184" text-anchor="middle" font-size="9" fill="#777">posición, clics</text>

  <rect x="48" y="200" width="104" height="36" rx="6" fill="#fff" stroke="#9fa8da" stroke-width="1"/>
  <text x="100" y="216" text-anchor="middle" font-size="11" fill="#333">Disco / Red</text>
  <text x="100" y="230" text-anchor="middle" font-size="9" fill="#777">archivos, datos</text>

  <rect x="48" y="246" width="104" height="36" rx="6" fill="#fff" stroke="#9fa8da" stroke-width="1"/>
  <text x="100" y="262" text-anchor="middle" font-size="11" fill="#333">Sensores</text>
  <text x="100" y="276" text-anchor="middle" font-size="9" fill="#777">cámara, micrófono</text>

  <!-- arrow entrada -> CPU -->
  <line x1="172" y1="213" x2="228" y2="213" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="200" y="206" text-anchor="middle" font-size="9" fill="#5c6bc0">bits</text>

  <!-- ── CPU ── -->
  <rect x="230" y="58" width="320" height="260" rx="10" fill="#fce4ec" stroke="#e91e63" stroke-width="1.8"/>
  <text x="390" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#c2185b">PROCESAMIENTO</text>
  <text x="390" y="95" text-anchor="middle" font-size="10" fill="#e91e63">Unidad Central de Proceso (CPU)</text>

  <rect x="248" y="108" width="130" height="82" rx="8" fill="#fff" stroke="#f48fb1" stroke-width="1.2"/>
  <text x="313" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#880e4f">ALU</text>
  <text x="313" y="143" text-anchor="middle" font-size="9.5" fill="#555">Unidad Aritmético-</text>
  <text x="313" y="156" text-anchor="middle" font-size="9.5" fill="#555">Lógica</text>
  <text x="313" y="171" text-anchor="middle" font-size="9" fill="#888">+  −  ×  ÷  AND  OR</text>

  <rect x="402" y="108" width="130" height="82" rx="8" fill="#fff" stroke="#f48fb1" stroke-width="1.2"/>
  <text x="467" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#880e4f">Unidad de Control</text>
  <text x="467" y="144" text-anchor="middle" font-size="9.5" fill="#555">Decodifica y ejecuta</text>
  <text x="467" y="157" text-anchor="middle" font-size="9.5" fill="#555">instrucciones</text>
  <text x="467" y="171" text-anchor="middle" font-size="9" fill="#888">fetch → decode → execute</text>

  <rect x="248" y="204" width="284" height="44" rx="8" fill="#fff" stroke="#f48fb1" stroke-width="1.2"/>
  <text x="390" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#880e4f">Registros</text>
  <text x="390" y="238" text-anchor="middle" font-size="9.5" fill="#555">Almacenamiento ultrarrápido interno (~bytes, ~1 ns)</text>

  <rect x="248" y="260" width="284" height="36" rx="8" fill="#fce4ec" stroke="#f06292" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="390" y="276" text-anchor="middle" font-size="9.5" fill="#880e4f">Reloj del sistema — sincroniza todas las operaciones</text>
  <text x="390" y="289" text-anchor="middle" font-size="9" fill="#ad1457">GHz = miles de millones de ciclos por segundo</text>

  <!-- arrow CPU -> salida -->
  <line x1="550" y1="213" x2="606" y2="213" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="578" y="206" text-anchor="middle" font-size="9" fill="#2e7d32">bits</text>

  <!-- ── SALIDA ── -->
  <rect x="608" y="58" width="140" height="260" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="678" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">SALIDA</text>
  <text x="678" y="95" text-anchor="middle" font-size="10" fill="#43a047">Output</text>

  <rect x="626" y="108" width="104" height="36" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="678" y="124" text-anchor="middle" font-size="11" fill="#333">Pantalla</text>
  <text x="678" y="138" text-anchor="middle" font-size="9" fill="#777">imágenes, texto</text>

  <rect x="626" y="154" width="104" height="36" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="678" y="170" text-anchor="middle" font-size="11" fill="#333">Altavoz</text>
  <text x="678" y="184" text-anchor="middle" font-size="9" fill="#777">sonido</text>

  <rect x="626" y="200" width="104" height="36" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="678" y="216" text-anchor="middle" font-size="11" fill="#333">Impresora</text>
  <text x="678" y="230" text-anchor="middle" font-size="9" fill="#777">documentos</text>

  <rect x="626" y="246" width="104" height="36" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="678" y="262" text-anchor="middle" font-size="11" fill="#333">Disco / Red</text>
  <text x="678" y="276" text-anchor="middle" font-size="9" fill="#777">archivos guardados</text>

  <!-- ── RAM — separate block below CPU ── -->
  <rect x="280" y="336" width="220" height="52" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="390" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">Memoria RAM</text>
  <text x="390" y="372" text-anchor="middle" font-size="9.5" fill="#1565c0">Memoria de trabajo</text>

  <!-- double-headed arrow CPU <-> RAM -->
  <line x1="390" y1="318" x2="390" y2="334" stroke="#1565c0" stroke-width="1.8"
        marker-start="url(#arr-blue-s)" marker-end="url(#arr-blue-e)"/>
  <text x="408" y="330" font-size="9" fill="#1565c0">datos</text>

  <!-- ── Bottom summary bar ── -->
  <rect x="30" y="480" width="718" height="62" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.2"/>
  <text x="390" y="498" text-anchor="middle" font-size="11" font-weight="600" fill="#f57f17">Ciclo fundamental</text>
  <text x="390" y="514" text-anchor="middle" font-size="11" fill="#555">Entrada (datos)  →  Proceso (instrucciones)  →  Salida (resultados)</text>
  <text x="390" y="532" text-anchor="middle" font-size="10" fill="#888">Todo se representa internamente como secuencias de 0s y 1s (bits)</text>

  <!-- Hierarchy note -->
  <!-- <rect x="30" y="480" width="718" height="46" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/> -->
  <!-- <text x="390" y="498" text-anchor="middle" font-size="10" font-weight="600" fill="#6a1b9a">Jerarquía de memoria (velocidad ↓, capacidad ↑)</text> -->
  <!-- <text x="390" y="514" text-anchor="middle" font-size="10" fill="#555">Registros (~1 ns)  →  Caché (~5 ns)  →  RAM (~100 ns)  →  Disco (~ms)</text> -->

  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5c6bc0"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2e7d32"/>
    </marker>
    <marker id="arr-blue-s" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/>
    </marker>
    <marker id="arr-blue-e" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/>
    </marker>
  </defs>

</svg>
